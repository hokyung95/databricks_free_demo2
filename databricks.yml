# This is a Declarative Automation Bundle definition for databricks_free_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_free_demo
  uuid: 3237c868-b54f-44e7-812d-7f00b0ba5455

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-14acdafc-8f5a.cloud.databricks.com?w=7474660147107595
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-14acdafc-8f5a.cloud.databricks.com?w=7474660147107595
      # We explicitly deploy to /Workspace/Users/hhokyung@naver.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hhokyung@naver.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: hhokyung@naver.com
        level: CAN_MANAGE
